<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لقطات الشاشة — روضة احباب الله</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0F2B4E; color: #fff; padding: 24px 16px; }
    h1 { text-align: center; font-size: 22px; margin-bottom: 8px; color: #4ADE80; }
    p  { text-align: center; font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; max-width: 900px; margin: 0 auto; }
    .card { background: #1E3A5F; border-radius: 12px; overflow: hidden; }
    .card img { width: 100%; display: block; }
    .card a { display: block; text-align: center; padding: 10px; color: #4ADE80; font-size: 13px; text-decoration: none; background: #14532d; }
    .card a:hover { background: #166534; }
  </style>
</head>
<body>
  <h1>🌿 روضة احباب الله — لقطات الشاشة</h1>
  <p>انقر على "تحميل" تحت كل صورة ثم ارفعها على Google Play Console</p>
  <div class="grid">
    <div class="card">
      <img src="01_dashboard.png" alt="لوحة التحكم" loading="lazy" />
      <a href="01_dashboard.png" download>⬇ تحميل — لوحة التحكم</a>
    </div>
    <div class="card">
      <img src="02_students.png" alt="سجل الطلاب" loading="lazy" />
      <a href="02_students.png" download>⬇ تحميل — سجل الطلاب</a>
    </div>
    <div class="card">
      <img src="03_grades.png" alt="الدرجات" loading="lazy" />
      <a href="03_grades.png" download>⬇ تحميل — الدرجات</a>
    </div>
    <div class="card">
      <img src="04_finance.png" alt="الماليات" loading="lazy" />
      <a href="04_finance.png" download>⬇ تحميل — الماليات</a>
    </div>
    <div class="card">
      <img src="05_parent.png" alt="ولي الأمر" loading="lazy" />
      <a href="05_parent.png" download>⬇ تحميل — واجهة الوالدين</a>
    </div>
    <div class="card">
      <img src="06_notifications.png" alt="الإشعارات" loading="lazy" />
      <a href="06_notifications.png" download>⬇ تحميل — الإشعارات</a>
    </div>
  </div>
</body>
</html>
