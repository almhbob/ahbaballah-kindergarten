name: Build Android — بناء تطبيق أندرويد

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'apk'
        type: choice
        options:
          - preview
          - apk
          - play-store
      submit:
        description: 'Submit to Google Play after build?'
        required: true
        default: 'false'
        type: boolean

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN2 }}

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check (non-blocking)
        run: npx tsc --noEmit --skipLibCheck || true

      - name: ESLint check (non-blocking)
        run: npm run lint || true

      - name: Expo Doctor (non-blocking)
        run: npx expo doctor || true

  build-apk:
    name: Build APK (Internal Testing)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS Auth
        run: eas whoami

      - name: Build APK and wait for result
        run: |
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'apk' }} \
            --non-interactive \
            --wait \
            --json 2>/dev/null | python3 -c "
          import sys, json
          builds = json.loads(sys.stdin.read())
          b = builds[0] if isinstance(builds, list) else builds
          url = b.get('artifacts', {}).get('buildUrl', '')
          if url:
              print(f'✅ APK URL: {url}')
          else:
              print('Build submitted - check expo.dev for download')
          " 2>/dev/null || \
          eas build \
            --platform android \
            --profile ${{ github.event.inputs.profile || 'apk' }} \
            --non-interactive \
            --wait

      - name: Download and upload APK artifact
        id: download_apk
        run: |
          APK_URL=$(eas build:list \
            --platform android \
            --limit 1 \
            --json \
            --non-interactive 2>/dev/null | \
          python3 -c "
          import sys, json
          builds = json.loads(sys.stdin.read())
          if builds:
              url = builds[0].get('artifacts', {}).get('buildUrl', '')
              if url: print(url)
          " 2>/dev/null || true)
          if [ -n "$APK_URL" ]; then
            echo "Downloading APK from: $APK_URL"
            curl -L --retry 3 "$APK_URL" -o ahbaballah.apk
            ls -lh ahbaballah.apk
            echo "apk_found=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK to GitHub Artifacts
        if: steps.download_apk.outputs.apk_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ahbaballah-kindergarten-apk
          path: ahbaballah.apk
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## Android APK Build" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: ${{ github.event.inputs.profile || 'apk' }}" >> $GITHUB_STEP_SUMMARY
          echo "- EAS builds: https://expo.dev/accounts/almhbob609/projects/ahbaballah-kindergarten/builds" >> $GITHUB_STEP_SUMMARY

  build-aab:
    name: Build AAB (Google Play)
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.profile == 'play-store'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Verify EAS Auth
        run: eas whoami

      - name: Build AAB for Google Play and wait for result
        run: |
          eas build \
            --platform android \
            --profile play-store \
            --non-interactive \
            --wait

      - name: Build summary
        if: always()
        run: |
          echo "## Android AAB Build" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: play-store" >> $GITHUB_STEP_SUMMARY
          echo "- EAS builds: https://expo.dev/accounts/almhbob609/projects/ahbaballah-kindergarten/builds" >> $GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-aab
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-merges | head -20)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --oneline --no-merges)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "روضة أحباب الله — ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## إصدار ${{ steps.version.outputs.version }}

            نظام إدارة روضة أحباب الله

            ### التغييرات في هذا الإصدار:
            ```
            ${{ steps.changelog.outputs.changes }}
            ```

            روابط:
            - متابعة البناء على EAS: https://expo.dev/accounts/almhbob2026/projects/ahbaballah-kindergarten/builds
            - Google Play Console: https://play.google.com/console

            تطوير: م / عاصم عبدالرحمن محمد
