name: Build Android — بناء تطبيق أندرويد

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile'
        required: true
        default: 'apk'
        type: choice
        options:
          - preview
          - apk
          - play-store
      submit:
        description: 'Submit to Google Play after build?'
        required: true
        default: 'false'
        type: boolean

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit --skipLibCheck

  build-apk:
    name: Build APK (Internal Testing)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: eas build --platform android --profile ${{ github.event.inputs.profile || 'apk' }} --non-interactive --no-wait

  build-aab:
    name: Build AAB (Google Play)
    runs-on: ubuntu-latest
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.profile == 'play-store'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build AAB for Google Play
        id: build
        run: |
          BUILD_ID=$(eas build --platform android --profile play-store --non-interactive --json --no-wait | jq -r 'if type=="array" then .[0].id else .id end')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "EAS Build started: $BUILD_ID"

      - name: Build summary
        run: |
          echo "## Android Build Started" >> $GITHUB_STEP_SUMMARY
          echo "- Profile: play-store (AAB)" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor: https://expo.dev/accounts/almhbob2026/projects/ahbaballah-kindergarten/builds" >> $GITHUB_STEP_SUMMARY

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-aab
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            CHANGES=$(git log --oneline --no-merges | head -20)
          else
            CHANGES=$(git log ${PREV_TAG}..HEAD --oneline --no-merges)
          fi
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "روضة أحباب الله — ${{ steps.version.outputs.version }}"
          tag_name: ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## إصدار ${{ steps.version.outputs.version }}

            نظام إدارة روضة أحباب الله

            ### التغييرات في هذا الإصدار:
            ```
            ${{ steps.changelog.outputs.changes }}
            ```

            روابط:
            - متابعة البناء على EAS: https://expo.dev/accounts/almhbob2026/projects/ahbaballah-kindergarten/builds
            - Google Play Console: https://play.google.com/console

            تطوير: م / عاصم عبدالرحمن محمد
