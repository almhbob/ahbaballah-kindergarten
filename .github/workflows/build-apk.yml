name: Build staged Android APK (manual only)
on:
  workflow_dispatch:
    inputs:
      api_origin:
        description: Stable HTTPS API origin for the approved staging environment
        required: true
        type: string
      staging_migration_approved:
        description: Backups, account/data migration and staging acceptance reviewed; allow an EAS build (may incur charges)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.staging_migration_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Validate staged API and override the build copy only
        env:
          STAGING_API_ORIGIN: ${{ inputs.api_origin }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          (async () => {
            const u = new URL(process.env.STAGING_API_ORIGIN.trim());
            if (u.protocol !== 'https:' || u.username || u.password || u.search || u.hash ||
                u.pathname !== '/' || u.hostname.endsWith('.replit.dev') ||
                ['localhost', '127.0.0.1', '[::1]'].includes(u.hostname)) {
              throw new Error('A stable HTTPS API origin is required');
            }
            const response = await fetch(u.origin + '/api/health', { signal: AbortSignal.timeout(10000) });
            if (!response.ok || (await response.json()).ok !== true) throw new Error('Staged API health check failed');
            const config = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
            if (!config.build?.apk) throw new Error('Missing apk build profile');
            config.build.apk.env = { ...config.build.apk.env,
              EXPO_PUBLIC_DOMAIN: u.origin, EXPO_PUBLIC_FIREBASE_SYNC_ENABLED: 'false' };
            fs.writeFileSync('eas.json', JSON.stringify(config, null, 2));
          })().catch(() => { console.error('Staging validation failed; no build started'); process.exitCode = 1; });
          NODE
      - name: Build APK via EAS without submitting or publishing
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -e
          test -n "$EXPO_TOKEN" || { echo "Configure EXPO_TOKEN in repository secrets"; exit 1; }
          npx --yes eas-cli@latest build --platform android --profile apk --non-interactive --wait --json > eas-result.json
          node <<'NODE'
          const fs = require('node:fs');
          const result = JSON.parse(fs.readFileSync('eas-result.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl;
          if (typeof url !== 'string' || new URL(url).protocol !== 'https:') throw new Error('No valid APK artifact');
          // Signed artifact URLs stay out of console logs.
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'artifact_url=' + url + '\n');
          NODE
      - name: Download and validate APK
        env:
          APK_URL: ${{ steps.eas_build.outputs.artifact_url }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 "$APK_URL" -o app-release.apk
          unzip -tq app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ahbaballah-staging-apk
          path: app-release.apk
          retention-days: 14
