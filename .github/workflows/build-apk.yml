name: Build APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build APK via EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN2 }}
        run: |
          set -e
          echo "=== EAS Authentication Check ==="
          eas whoami || { echo "AUTH FAILED - token invalid"; exit 1; }
          echo "=== Starting EAS Build ==="
          BUILD_JSON=$(eas build \
            --platform android \
            --profile apk \
            --non-interactive \
            --wait \
            --json 2>&1)
          echo "$BUILD_JSON"
          APK_URL=$(echo "$BUILD_JSON" | python3 -c "
import sys, json
data = sys.stdin.read()
try:
    builds = json.loads(data)
    if isinstance(builds, list) and builds:
        url = builds[0].get('artifacts', {}).get('buildUrl', '')
        if url: print(url)
    elif isinstance(builds, dict):
        url = builds.get('artifacts', {}).get('buildUrl', '')
        if url: print(url)
except Exception as e:
    sys.stderr.write(str(e)+'\n')
" 2>/dev/null || true)
          if [ -n "$APK_URL" ]; then
            echo "APK_URL=$APK_URL" >> $GITHUB_OUTPUT
            echo "=== APK URL: $APK_URL ==="
          else
            echo "=== Trying eas build:list fallback ==="
            sleep 5
            LIST_JSON=$(eas build:list --platform android --limit 1 --json --non-interactive 2>/dev/null || echo "[]")
            APK_URL=$(echo "$LIST_JSON" | python3 -c "
import sys, json
builds = json.loads(sys.stdin.read())
if builds:
    url = builds[0].get('artifacts', {}).get('buildUrl', '')
    if url: print(url)
" 2>/dev/null || true)
            if [ -n "$APK_URL" ]; then
              echo "APK_URL=$APK_URL" >> $GITHUB_OUTPUT
              echo "=== APK URL (fallback): $APK_URL ==="
            else
              echo "ERROR: Could not get APK URL"
              exit 1
            fi
          fi

      - name: Download APK
        run: |
          APK_URL="${{ steps.eas_build.outputs.APK_URL }}"
          echo "Downloading from: $APK_URL"
          curl -L --retry 3 "$APK_URL" -o app-release.apk
          ls -lh app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahbaballah-apk
          path: app-release.apk
          retention-days: 30
