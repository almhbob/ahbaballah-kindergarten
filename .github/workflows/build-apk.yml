name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install EAS CLI
        run: npm install -g eas-cli
        
      - name: Build APK via EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN2 }}
        run: eas build --platform android --profile apk --non-interactive --wait
        
      - name: Download and upload APK artifact
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN2 }}
        run: |
          URL=$(eas build:list --platform android --limit 1 --json --non-interactive | python3 -c "import sys,json; builds=json.load(sys.stdin); print(builds[0]['artifacts']['buildUrl'])")
          curl -L "$URL" -o app-release.apk
          echo "APK downloaded"
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
