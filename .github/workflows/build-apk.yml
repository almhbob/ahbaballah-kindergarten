name: Build APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build APK via EAS
        id: eas_build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN2 }}
        run: |
          set -euo pipefail
          echo "=== EAS Authentication Check ==="
          if ! eas whoami; then
            echo "::error::EXPO_TOKEN2 is invalid or expired. Create a new token at https://expo.dev/settings/access-tokens and update the EXPO_TOKEN2 repository secret."
            exit 1
          fi
          echo "=== Starting EAS Build ==="
          # JSON goes to stdout only; logs go to stderr so the JSON stays parseable.
          eas build --platform android --profile apk --non-interactive --wait --json > build.json
          APK_URL=$(jq -r 'if type == "array" then .[0] else . end | .artifacts.buildUrl // empty' build.json)
          if [ -z "$APK_URL" ]; then
            echo "=== Trying eas build:list fallback ==="
            eas build:list --platform android --limit 1 --json --non-interactive > list.json || echo "[]" > list.json
            APK_URL=$(jq -r '.[0].artifacts.buildUrl // empty' list.json)
          fi
          if [ -z "$APK_URL" ]; then
            echo "::error::Could not get the APK URL from EAS"
            exit 1
          fi
          echo "APK_URL=$APK_URL" >> "$GITHUB_OUTPUT"
          echo "=== APK URL: $APK_URL ==="

      - name: Download APK
        run: |
          APK_URL="${{ steps.eas_build.outputs.APK_URL }}"
          echo "Downloading from: $APK_URL"
          curl -L --retry 3 "$APK_URL" -o app-release.apk
          ls -lh app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ahbaballah-apk
          path: app-release.apk
          retention-days: 30
